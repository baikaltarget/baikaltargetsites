# Проверка сборки без выкладки: запускается на любой ветке, кроме main (и вручную).
name: Проверка сборки
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Что получилось (в аннотациях)
        run: |
          n() { echo "::notice title=$1::$2"; }
          n html "$(find out -name '*.html' | wc -l) страниц"
          for f in api/lead.php favicon.ico icon.svg apple-icon.png manifest.webmanifest robots.txt sitemap.xml llms.txt 404.html .htaccess index.html blog/index.html otzyvy/index.html politika/index.html; do
            if [ -e "out/$f" ]; then n file "$f: $(wc -c < out/$f) байт"; else n missing "$f НЕТ"; fi
          done
          n icons "$(grep -o '<link rel="[a-z-]*icon"[^>]*>' out/index.html | tr '\n' ' ')"
          n top "$(ls out | tr '\n' ' ')"
          n otzyvy "$(grep -o '<title>[^<]*</title>' out/otzyvy/index.html 2>/dev/null) $(grep -o 'noindex' out/otzyvy/index.html 2>/dev/null | head -1)"
