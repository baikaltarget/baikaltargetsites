# Проверка сборки без выкладки: запускается на любой ветке, кроме main (и вручную).
name: Проверка сборки
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Метрика в HTML
        run: |
          echo "::notice title=ym-count::$(grep -o '113670113' out/index.html | wc -l)"
          echo "::notice title=ym-ctx::$(grep -o '.\{200\}mc.yandex.ru/metrika.\{120\}' out/index.html | head -1 | tr -d '\n' | cut -c1-400)"
