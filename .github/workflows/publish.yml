# Сборка и выкладка sites.baikal-target.ru на хостинг Бегет (вместо Vercel). По схеме btctour.ru.
#
# Когда запускается: после каждого коммита в main (сайт обновляется через 3–10 минут) и вручную:
# вкладка Actions → «Сборка и выкладка на Бегет» → Run workflow.
#
# Секреты репозитория (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — FTP из панели Бегета (папка public_html сайта);
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — куда слать заявки; по желанию TELEGRAM_API (ретранслятор).
# Переменные (там же, вкладка Variables):
#   FORCE_HTTPS = 1 — переадресация на https (только после выпуска SSL в панели Бегета).
name: Сборка и выкладка на Бегет

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::Нет секретов FTP_SERVER / FTP_USERNAME / FTP_PASSWORD — добавьте их в Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -d app/api ]; then
            echo "::error::Удалите папку app/api — на Бегете заявки принимает public/api/lead.php"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка
        run: npm ci --no-audit --no-fund

      - name: Сборка сайта
        env:
          FORCE_HTTPS: ${{ vars.FORCE_HTTPS }}
        run: npm run build

      - name: Ключи формы заявок
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
        run: node scripts/lead-config.mjs

      - name: Загрузка на Бегет
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          timeout: 120000
